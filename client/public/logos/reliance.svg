  </defs>

  <!-- Crest Outer Ring -->
  <circle cx="50" cy="44" r="28" fill="url(#relNavy)"/>
  <circle cx="50" cy="44" r="24" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Classic Reliance Flame / Diya Core Symbol -->
  <path d="M 50 25 C 44 33, 41 38, 41 44 C 41 49, 45 53, 50 53 C 55 53, 59 49, 59 44 C 59 38, 56 33, 50 25 Z" fill="url(#relRed)"/>
  <path d="M 50 32 C 47 37, 45 40, 45 44 C 45 47, 47 49, 50 49 C 53 49, 55 47, 55 44 C 55 40, 53 37, 50 32 Z" fill="#FBBF24"/>
  <circle cx="50" cy="45" r="2" fill="#FFFFFF"/>
  
  <!-- Ribbon Base with 'Reliance' / 'POWER' -->
  <rect x="14" y="76" width="72" height="15" rx="3.5" fill="#0B2545"/>
  <text x="50" y="87" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">RELIANCE</text>
</svg>

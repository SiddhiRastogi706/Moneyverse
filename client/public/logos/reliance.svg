<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Base Container -->
  <rect width="100" height="100" rx="20" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="99" height="99" rx="19.5" stroke="#E2E8F0"/>
  
  <defs>
    <linearGradient id="relNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B2545"/>
      <stop offset="100%" stopColor="#134074"/>
    </linearGradient>
    <linearGradient id="relRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E63946"/>
      <stop offset="100%" stopColor="#C1121F"/>

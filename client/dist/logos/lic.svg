<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Base Container -->
  <rect width="100" height="100" rx="20" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="99" height="99" rx="19.5" stroke="#E2E8F0"/>
  
  <defs>
    <linearGradient id="licGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5B82E"/>
      <stop offset="100%" stopColor="#D97706"/>
    </linearGradient>
    <linearGradient id="licNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#003875"/>
      <stop offset="100%" stopColor="#001F4D"/>
    </linearGradient>
  </defs>

  <!-- LIC Protect & Care Emblem (Two hands guarding the flame) -->
  <circle cx="50" cy="42" r="28" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  
  <!-- Central Flame (Deepak) -->
  <path d="M 50 20 C 45 28, 43 32, 43 37 C 43 41, 46 44, 50 44 C 54 44, 57 41, 57 37 C 57 32, 55 28, 50 20 Z" fill="url(#licGold)"/>
  <circle cx="50" cy="37" r="3" fill="#FFFFFF"/>

  <!-- Left Protecting Palm -->
  <path d="M 28 45 C 32 38, 40 46, 44 48 C 41 53, 34 54, 30 50 Z" fill="url(#licNavy)"/>
  <path d="M 30 52 C 34 55, 42 56, 46 51 L 46 54 C 40 58, 32 57, 28 53 Z" fill="url(#licNavy)"/>

  <!-- Right Protecting Palm -->
  <path d="M 72 45 C 68 38, 60 46, 56 48 C 59 53, 66 54, 70 50 Z" fill="url(#licNavy)"/>
  <path d="M 70 52 C 66 55, 58 56, 54 51 L 54 54 C 60 58, 68 57, 72 53 Z" fill="url(#licNavy)"/>

  <!-- LIC Badge Base -->
  <rect x="18" y="75" width="64" height="16" rx="4" fill="url(#licNavy)"/>
  <text x="50" y="86.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="900" fill="#F5B82E" text-anchor="middle" letter-spacing="1.2">LIC INDIA</text>
</svg>
